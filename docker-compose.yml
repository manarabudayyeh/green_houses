version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: green_house_app
    working_dir: /var/www
    volumes:
      - .:/var/www

  webserver:
    image: nginx:alpine
    container_name: green_house_nginx
    ports:
      - "8005:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: green_house_db
    restart: always
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"